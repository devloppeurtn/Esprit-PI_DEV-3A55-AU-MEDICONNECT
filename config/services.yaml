# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    photos_directory: '%kernel.project_dir%/public/uploads/photos'
    app_url: '%env(APP_URL)%'
    face_id_threshold_default: 0.55
    face_id_threshold: '%env(float:default:face_id_threshold_default:FACE_ID_THRESHOLD)%'
    face_id_service_url_default: 'http://localhost:8001'
    face_id_service_url: '%env(default:face_id_service_url_default:FACE_ID_SERVICE_URL)%'
    aws_rekognition_region_default: 'us-east-1'
    aws_rekognition_region: '%env(default:aws_rekognition_region_default:AWS_REGION)%'
    aws_rekognition_collection_default: 'mediconnect-face'
    aws_rekognition_collection: '%env(default:aws_rekognition_collection_default:AWS_REKOGNITION_COLLECTION_ID)%'
    aws_rekognition_threshold_default: 90
    aws_rekognition_threshold: '%env(float:default:aws_rekognition_threshold_default:AWS_REKOGNITION_MATCH_THRESHOLD)%'
    aws_ca_bundle_default: '%kernel.project_dir%/config/cacert.pem'
    aws_ca_bundle: '%env(default:aws_ca_bundle_default:AWS_CA_BUNDLE)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    
    App\Controller\AuthController:
        arguments:
            $photosDirectory: '%photos_directory%'
    
    App\Controller\UserController:
        arguments:
            $photosDirectory: '%photos_directory%'

    App\Service\FaceEmbeddingService:
        arguments:
            $threshold: '%face_id_threshold%'

    App\Service\FaceIdClient:
        arguments:
            $faceIdServiceUrl: '%face_id_service_url%'

    App\Service\AwsFaceIdService:
        arguments:
            $region: '%aws_rekognition_region%'
            $accessKeyId: '%env(AWS_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(AWS_SECRET_ACCESS_KEY)%'
            $collectionId: '%aws_rekognition_collection%'
            $sessionToken: '%env(default::AWS_SESSION_TOKEN)%'
            $matchThreshold: '%aws_rekognition_threshold%'
            $endpoint: '%env(default::AWS_REKOGNITION_ENDPOINT)%'
            $caBundle: '%aws_ca_bundle%'

    Webauthn\Bundle\Security\Guesser\CurrentUserEntityGuesser:
        arguments:
            $tokenStorage: '@security.token_storage'
            $userEntityRepository: '@Webauthn\Bundle\Repository\PublicKeyCredentialUserEntityRepository'
    
    App\Security\UserProvider:
        arguments:
            $entityManager: '@doctrine.orm.entity_manager'

    App\Security\LoginFailureHandler:
        arguments:
            $options: []
