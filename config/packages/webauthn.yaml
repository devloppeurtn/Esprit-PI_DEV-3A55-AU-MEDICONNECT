# Please see the following page for more information: https://webauthn-doc.spomky-labs.com/the-webauthn-server/the-symfony-way#configuration

webauthn:
    credential_repository: 'App\Repository\WebauthnCredentialRepository'
    user_repository: 'App\Security\WebauthnUserEntityRepository'

    creation_profiles:
        default:
            rp:
                name: '%env(RELYING_PARTY_NAME)%'
                id: '%env(RELYING_PARTY_ID)%'

    request_profiles:
        default:
            rp_id: '%env(RELYING_PARTY_ID)%'

    controllers:
        enabled: true
        creation:
            user_registration:
                options_path: '/webauthn/register/options'
                result_path: '/webauthn/register/result'
                user_entity_guesser: 'Webauthn\Bundle\Security\Guesser\CurrentUserEntityGuesser'
                secured_rp_ids:
                    - 'localhost'
        request:
            user_authentication:
                options_path: '/webauthn/login/options'
                result_path: '/webauthn/login/result'
                secured_rp_ids:
                    - 'localhost'
