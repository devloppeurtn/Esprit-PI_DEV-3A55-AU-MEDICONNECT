[build]
builder = "RAILPACK"
buildCommand = "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction"

[deploy]
startCommand = "install-php-extensions pdo_mysql intl 2>/dev/null; APP_ENV=prod php bin/console cache:clear && php -S 0.0.0.0:$PORT -t public"
restartPolicyType = "ON_FAILURE"
