[build]
builder = "RAILPACK"
buildCommand = "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction"

[deploy]
startCommand = "APP_ENV=prod php bin/console doctrine:migrations:migrate --no-interaction; APP_ENV=prod php bin/console cache:clear && php -S 0.0.0.0:$PORT -t public -c php.ini"
restartPolicyType = "ON_FAILURE"
